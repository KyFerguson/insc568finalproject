openapi: 3.1.1
info:
  title: Roster Server Services API
  version: 1.0.0
  description: >-
    API for creating an initial student application record.
  contact:
    name: Ky Ferguson
    email: kkf5375@psu.edu

servers:
  - url: https://localhost:3000
    description: Local HTTPS server

tags:
  - name: Health
  - name: Students
  - name: Enrollment

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      operationId: getHealth
      description: Returns a simple status check confirming the service is running.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                required:
                  - status
              example:
                status: ok

  /api/public/students:
    post:
      tags:
        - Students
      summary: Create initial student application
      description: >-
        Creates a student roster record from applicant-submitted student profile
        data and selected program ID. Program metadata and academic status are
        backend-managed defaults; fee, payment, and enrollment are not accepted
        in this request.
      operationId: createStudentBundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudentBundleRequest'
            examples:
              default:
                value:
                  student:
                    name: Jane Doe
                    SSN: ''
                    emailAddress: jane.doe@psu.edu
                    homePhone: ''
                    localAddr: ''
                    homeAddr: ''
                    emergencyContact: ''
                  programID: INSC
      responses:
        '201':
          description: Student records created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateStudentBundleResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                badRequest:
                  value:
                    error: 'Unsupported top-level fields: enrollment'
        '409':
          description: Duplicate student emailAddress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicateEmail:
                  value:
                    error: A student with this emailAddress already exists
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/public/students/legacy:
    post:
      tags:
        - Students
      summary: Create student application from legacy payload
      description: >-
        Adapter endpoint for legacy clients that submit semicolon-delimited
        key/value application text. The adapter maps legacy fields into the
        current CreateStudentBundle request contract and invokes the same
        student creation flow.
      operationId: createStudentBundleFromLegacy
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              minLength: 1
            examples:
              legacyText:
                value: >-
                  Name: Bob Smith; ID: 1111; Home Address: 123 Tulip Road,
                  Ambler PA 19002; Email: bsmith@yahoo.com; Phone:
                  215-777-8888
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyStudentAdapterJsonRequest'
            examples:
              legacyJson:
                value:
                  legacyPayload: >-
                    Name: Bob Smith; ID: 1111; Home Address: 123 Tulip Road,
                    Ambler PA 19002; Email: bsmith@yahoo.com; Phone:
                    215-777-8888
                  programID: INSC
      responses:
        '201':
          description: Student records created successfully through adapter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyCreateStudentBundleResponse'
        '400':
          description: Validation or legacy payload format error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidLegacyFormat:
                  value:
                    error: Legacy payload format is invalid. Expected key/value pairs separated by ';'.
        '409':
          description: Duplicate student emailAddress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/enrollment-info:
    get:
      tags:
        - Enrollment
      summary: Get enrollment info for a student
      description: >-
        Returns acceptance status, program details, and available courses for
        enrollment based on the student's program. Caller may provide either
        studentId or emailAddress, or both. If both are provided, they must
        resolve to the same student record; a mismatch returns 401.
      operationId: getEnrollmentInfo
      parameters:
        - name: studentId
          in: query
          required: false
          schema:
            type: string
          description: Student ID value such as STU001.
        - name: emailAddress
          in: query
          required: false
          schema:
            type: string
          description: Student email address used at login.
      responses:
        '200':
          description: Enrollment info returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEnrollmentInfoResponse'
        '400':
          description: Missing query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: studentId and emailAddress were both provided but do not match the same student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Student not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/students/admit:
    post:
      tags:
        - Students
      summary: Admit a student applicant
      description: >-
        Updates a student's academic status from 'applicant' to 'admitted'.
        Only students currently in 'applicant' status may be admitted.
      operationId: admitStudent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdmitStudentRequest'
            examples:
              default:
                value:
                  studentId: STU002
      responses:
        '200':
          description: Student admitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdmitStudentResponse'
        '400':
          description: Missing required field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Student not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Student is not in applicant status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                wrongStatus:
                  value:
                    error: "Student status is 'enrolled', must be 'applicant' to admit"
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/enrollments/approve-course:
    post:
      tags:
        - Enrollment
      summary: Approve a course enrollment (advisor review)
      description: >-
        Advances a course enrollment that is in 'Pending Advisor' status.
        The advisor may either approve the enrollment (moving it to 'Registered')
        or flag it for instructor review (moving it to 'Pending Instructor').
      operationId: approveCourseEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveCourseRequest'
            examples:
              approve:
                value:
                  enrollmentId: ENR001
                  decision: approve
              pendingInstructor:
                value:
                  enrollmentId: ENR001
                  decision: pending_instructor
      responses:
        '200':
          description: Enrollment status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveCourseResponse'
        '400':
          description: Missing or invalid field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidDecision:
                  value:
                    error: "Invalid decision 'reject'. Must be 'approve' or 'pending_instructor'"
        '404':
          description: Enrollment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Enrollment is not in Pending Advisor status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                wrongStatus:
                  value:
                    error: "Enrollment status is 'Registered', must be 'Pending Advisor' to approve"
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/enrollments:
    post:
      tags:
        - Enrollment
      summary: Submit enrollment selections
      description: >-
        Accepts a student ID and one or more course schedule IDs, then creates
        enrollment records. This endpoint is designed for frontend form submit
        workflows with a minimal request body.
      operationId: createEnrollments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentSelectionRequest'
            examples:
              singleCourse:
                value:
                  studentId: STU001
                  courseScheduleIds:
                    - INSC 568 F2026
      responses:
        '201':
          description: Enrollment selections submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEnrollmentSelectionResponse'
        '400':
          description: Validation error or student not eligible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Student not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate enrollment conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    LegacyStudentAdapterJsonRequest:
      type: object
      properties:
        legacyPayload:
          type: string
          minLength: 1
        application:
          type: string
          minLength: 1
        payload:
          type: string
          minLength: 1
        programID:
          type: string
          minLength: 1
      additionalProperties: false

    CreateStudentBundleRequest:
      type: object
      properties:
        student:
          $ref: '#/components/schemas/StudentInput'
        programID:
          type: string
          minLength: 1
      required:
        - student
        - programID
      additionalProperties: false

    StudentInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        SSN:
          type: string
        emailAddress:
          type: string
          minLength: 1
        homePhone:
          type: string
        localAddr:
          type: string
        homeAddr:
          type: string
        emergencyContact:
          type: string
      required:
        - name
        - emailAddress
      additionalProperties: false

    CreateStudentBundleResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            student:
              $ref: '#/components/schemas/StudentRecord'
            program:
              $ref: '#/components/schemas/ProgramRecord'
            academicStatus:
              $ref: '#/components/schemas/AcademicStatusRecord'
          required:
            - student
            - program
            - academicStatus
      required:
        - message
        - data

    LegacyCreateStudentBundleResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            application:
              type: object
              properties:
                studentId:
                  type: string
                program:
                  type: object
                  properties:
                    programId:
                      type: string
                    programName:
                      type: string
                  required:
                    - programId
                    - programName
                statusType:
                  type: string
                  enum:
                    - applicant
                    - admitted
                    - enrolled
                    - probation
                  description: The student's current academic standing.
              required:
                - studentId
                - program
                - statusType
            adapter:
              type: object
              properties:
                source:
                  type: string
                legacyApplicantId:
                  type: string
              required:
                - source
          required:
            - application
            - adapter
      required:
        - message
        - data

    StudentRecord:
      type: object
      properties:
        stuId:
          type: string
        name:
          type: string
        SSN:
          type: string
        emailAddress:
          type: string
        homePhone:
          type: string
        localAddr:
          type: string
        homeAddr:
          type: string
        emergencyContact:
          type: string
        programID:
          type: string
        paymentID:
          type: string
        academicStatusID:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - stuId
        - name
        - emailAddress
        - programID
        - paymentID
        - academicStatusID
        - createdAt
        - updatedAt

    ProgramRecord:
      type: object
      properties:
        programID:
          type: string
        name:
          type: string
        department:
          type: string
        college:
          type: string
      required:
        - programID

    AcademicStatusRecord:
      type: object
      properties:
        academicStatusID:
          type: string
        statusType:
          type: string
          enum:
            - applicant
            - admitted
            - enrolled
            - probation
          description: The student's current academic standing.
        remark:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - academicStatusID
        - statusType
        - createdAt
        - updatedAt


    EnrollmentRecord:
      type: object
      properties:
        enrollmentId:
          type: string
        studentId:
          type: string
        courseScheduleId:
          type: string
        credit:
          type: number
        feeID:
          type: string
        status:
          type: string
          enum:
            - Requested
            - Pending Advisor
            - Pending Instructor
            - Registered
          description: >-
            Lifecycle state of the enrollment. 'Requested' is the initial state;
            'Pending Advisor' indicates advisor review is required; 'Pending Instructor'
            indicates further instructor review; 'Registered' is the final approved state.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - enrollmentId
        - studentId
        - courseScheduleId
        - credit
        - feeID
        - status
        - createdAt
        - updatedAt

    EnrollmentCourse:
      type: object
      properties:
        courseScheduleID:
          type: string
        courseID:
          type: string
        courseName:
          type: string
        courseDescriptionUrl:
          type: string
          format: uri
          description: Link to the course description page.
        sectionNo:
          type: integer
        semester:
          type: string
        scheduleTime:
          type: string
        location:
          type: string
        credits:
          type: integer
        prerequisite:
          type: string
        availability:
          type: boolean
        requiresAdvisorApproval:
          type: boolean
          description: >-
            When true, the student's enrollment request must be reviewed and
            approved by an advisor before it advances past the Pending Advisor
            status.
      required:
        - courseScheduleID
        - courseID
        - courseName
        - requiresAdvisorApproval

    EnrollmentInfo:
      type: object
      properties:
        student:
          type: object
          properties:
            studentId:
              type: string
            name:
              type: string
            emailAddress:
              type: string
          required:
            - studentId
            - name
            - emailAddress
        acceptanceRecord:
          type: object
          properties:
            statusType:
              type: string
              enum:
                - applicant
                - admitted
                - enrolled
                - probation
              description: The student's current academic standing.
            canRegister:
              type: boolean
          required:
            - statusType
            - canRegister
        program:
          allOf:
            - $ref: '#/components/schemas/ProgramRecord'
          nullable: true
        availableCourses:
          type: array
          items:
            $ref: '#/components/schemas/EnrollmentCourse'
      required:
        - student
        - acceptanceRecord
        - availableCourses

    GetEnrollmentInfoResponse:
      type: object
      properties:
        message:
          type: string
        data:
          $ref: '#/components/schemas/EnrollmentInfo'
      required:
        - message
        - data

    CreateEnrollmentSelectionRequest:
      type: object
      properties:
        studentId:
          type: string
          minLength: 1
        courseScheduleIds:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
      required:
        - studentId
        - courseScheduleIds
      additionalProperties: false

    EnrollmentSubmissionSummary:
      type: object
      properties:
        student:
          type: object
          properties:
            studentId:
              type: string
            name:
              type: string
          required:
            - studentId
            - name
        enrollments:
          type: array
          items:
            $ref: '#/components/schemas/EnrollmentRecord'
      required:
        - student
        - enrollments

    CreateEnrollmentSelectionResponse:
      type: object
      properties:
        message:
          type: string
        data:
          $ref: '#/components/schemas/EnrollmentSubmissionSummary'
      required:
        - message
        - data

    AdmitStudentRequest:
      type: object
      properties:
        studentId:
          type: string
          minLength: 1
      required:
        - studentId
      additionalProperties: false

    AdmitStudentResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            student:
              type: object
              properties:
                studentId:
                  type: string
                name:
                  type: string
              required:
                - studentId
                - name
            academicStatus:
              type: object
              properties:
                academicStatusID:
                  type: string
                statusType:
                  type: string
                  enum:
                    - applicant
                    - admitted
                    - enrolled
                    - probation
                  description: The student's current academic standing.
                remark:
                  type: string
                updatedAt:
                  type: string
                  format: date-time
              required:
                - academicStatusID
                - statusType
                - updatedAt
          required:
            - student
            - academicStatus
      required:
        - message
        - data

    ApproveCourseRequest:
      type: object
      properties:
        enrollmentId:
          type: string
          minLength: 1
        decision:
          type: string
          enum:
            - approve
            - pending_instructor
          description: "'approve' moves the enrollment to Registered. 'pending_instructor' moves it to Pending Instructor."
      required:
        - enrollmentId
        - decision
      additionalProperties: false

    ApproveCourseResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            enrollment:
              type: object
              properties:
                enrollmentId:
                  type: string
                studentId:
                  type: string
                courseScheduleId:
                  type: string
                status:
                  type: string
                  enum:
                    - Registered
                    - Pending Instructor
                updatedAt:
                  type: string
                  format: date-time
              required:
                - enrollmentId
                - studentId
                - courseScheduleId
                - status
                - updatedAt
          required:
            - enrollment
      required:
        - message
        - data

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error